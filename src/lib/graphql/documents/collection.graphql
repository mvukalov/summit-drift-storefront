query Collections {
  collections(first: 250) {
    nodes {
      ...CollectionSummary
    }
  }
}

# Fetches the whole collection in one request: the API ignores filters,
# so facets are computed from these products (project overview §5.1).
query CollectionByHandle($handle: String!) {
  collection(handle: $handle) {
    ...CollectionSummary
    products(first: 250) {
      nodes {
        ...ProductCard
      }
    }
  }
}
