fragment Money on MoneyV2 {
  amount
  currencyCode
}

fragment Image on Image {
  url
  altText
  width
  height
}

fragment CollectionSummary on Collection {
  handle
  title
  description
  image {
    ...Image
  }
}

fragment ProductCard on Product {
  handle
  title
  # Facets are derived from these values (project overview §5.1): the API ignores
  # filters, so the option axes a collection actually uses come from its products.
  options {
    name
    values
  }
  featuredImage {
    ...Image
  }
  priceRange {
    minVariantPrice {
      ...Money
    }
  }
  compareAtPriceRange {
    minVariantPrice {
      ...Money
    }
    maxVariantPrice {
      ...Money
    }
  }
}

fragment ProductVariant on ProductVariant {
  id
  title
  sku
  availableForSale
  selectedOptions {
    name
    value
  }
  price {
    ...Money
  }
  compareAtPrice {
    ...Money
  }
  # Every variant in this catalog reports the product's featured image (verified across all
  # 30 products, 2026-09-23), but the field is per-variant, so the picker honours it.
  image {
    ...Image
  }
}

fragment ProductDetail on Product {
  handle
  title
  # The brand for the PDP's Product JSON-LD; uniform across the catalog.
  vendor
  # Plain text. Used for metadata and JSON-LD: `seo.description` is unusable here (17 of 30
  # products return HTML in it and 23 are truncated mid-sentence, verified 2026-09-23).
  description
  descriptionHtml
  options {
    name
    values
  }
  images(first: 10) {
    nodes {
      ...Image
    }
  }
  variants(first: 100) {
    nodes {
      ...ProductVariant
    }
  }
}
