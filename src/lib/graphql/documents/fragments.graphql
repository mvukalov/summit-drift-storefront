fragment Money on MoneyV2 {
  amount
  currencyCode
}

fragment Image on Image {
  url
  altText
  width
  height
}

fragment CollectionSummary on Collection {
  handle
  title
  description
  image {
    ...Image
  }
}

fragment ProductCard on Product {
  handle
  title
  # Facets are derived from these values (project overview §5.1): the API ignores
  # filters, so the option axes a collection actually uses come from its products.
  options {
    name
    values
  }
  featuredImage {
    ...Image
  }
  priceRange {
    minVariantPrice {
      ...Money
    }
  }
  compareAtPriceRange {
    minVariantPrice {
      ...Money
    }
    maxVariantPrice {
      ...Money
    }
  }
}
